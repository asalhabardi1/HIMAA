
<!DOCTYPE html>

<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>HIMA | Spatial Analysis Viewer</title>
<link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet"/>
<style>
/* GENERAL */
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f5ef;
    color: #26352a;
}
/* HEADER */
header {
    padding: 18px 22px;
    background: #344b3a;
    color: white;
}
header h2 {
    margin: 0 0 6px;
}
header p {
    margin: 0;
    opacity: .85;
    font-size: 13px;
}
/* CONTROLS */
.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    padding: 15px;
    background: white;
}
label {
    font-size: 13px;
    font-weight: bold;
}
select {
    padding: 9px 12px;
    border: 1px solid #cbd3c6;
    border-radius: 7px;
    background: white;
    color: #26352a;
    min-width: 120px;
}
/* MAP */
#map {
    height: 72vh;
    min-height: 450px;
    width: 100%;
    background: #e9ece5;
    position: relative;
}
/* STATUS */
.status {
    padding: 9px 15px;
    background: #e7eee4;
    font-size: 12px;
}
.note {
    padding: 12px 16px;
    font-size: 12px;
    color: #526253;
}
/* COMPARISON DIVIDER */
.compare-control {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 0;
    z-index: 1000;
    pointer-events: none;
    display: none;
}
.compare-line {
    position: absolute;
    top: 0;
    bottom: 0;
    left: -2px;
    width: 4px;
    background: white;
    box-shadow: 0 0 5px #0008;
    pointer-events: none;
}
/* DRAG HANDLE */
.compare-handle {
    position: absolute;
    top: 50%;
    left: -20px;
    transform: translateY(-50%);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: white;
    border: 2px solid #344b3a;
    box-shadow: 0 2px 9px #0005;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #344b3a;
    font-size: 19px;
    font-weight: bold;
    cursor: ew-resize;
    pointer-events: auto;
    touch-action: none;
    user-select: none;
    z-index: 1002;
}
.compare-handle:active {
    background: #e7eee4;
}
/* YEAR LABELS */
.map-label {
    position: absolute;
    top: 15px;
    z-index: 500;
    background: #344b3a;
    color: white;
    padding: 7px 12px;
    border-radius: 6px;
    font-size: 12px;
    pointer-events: none;
    display: none;
}
.label-left {
    left: 15px;
}
.label-right {
    right: 15px;
}
.leaflet-control-attribution {
    direction: ltr;
}
</style>
</head>
<body>
<header>
</header>
<div class="controls">
<label for="index">
        المؤشر المكاني
    </label>
<select id="index">
<option value="NDVI">NDVI</option>
<option value="MSAVI">MSAVI</option>
<option value="NDMI">NDMI</option>
</select>
<label for="mode">
        طريقة العرض
    </label>
<select id="mode">
<option value="swipe">
            مقارنة بالسحب
        </option>
<option value="single2016">
            2016 فقط
        </option>
<option value="single2025">
            2025 فقط
        </option>
</select>
</div>
<div id="map">
<div class="map-label label-left" id="label2016">
        2016
    </div>
<div class="map-label label-right" id="label2025">
        2025
    </div>
<div class="compare-control" id="compareControl">
<div class="compare-line"></div>
<div class="compare-handle" id="compareHandle">
            ↔
        </div>
</div>
</div>
<div class="status" id="status">
    جارٍ تحميل الخرائط...
</div>
<div class="note">
    HIMA — Spatial Analysis |
    Imam Turki bin Abdullah Royal Reserve
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const maps = {"NDVI_2016": {"image": "assets/NDVI_2016.png", "bounds": {"north": 31.18809138073112, "south": 25.80489190952591, "east": 46.09444142204805, "west": 39.36544208304155}}, "NDVI_2025": {"image": "assets/NDVI_2025.png", "bounds": {"north": 31.18809138073112, "south": 25.80489190952591, "east": 46.09444142204805, "west": 39.36544208304155}}, "MSAVI_2016": {"image": "assets/MSAVI_2016.png", "bounds": {"north": 30.87256603722384, "south": 26.19520887450141, "east": 45.42290156407605, "west": 39.57620511067302}}, "MSAVI_2025": {"image": "assets/MSAVI_2025.png", "bounds": {"north": 30.87256603722384, "south": 26.19520887450141, "east": 45.42290156407605, "west": 39.57620511067302}}, "NDMI_2016": {"image": "assets/NDMI_2016.png", "bounds": {"north": 30.94717473036969, "south": 26.11039937132064, "east": 45.81881076705892, "west": 39.77284156824762}}, "NDMI_2025": {"image": "assets/NDMI_2025.png", "bounds": {"north": 31.024192235594, "south": 25.8595568927586, "east": 46.08610086469823, "west": 39.63030668615397}}};
// ========================================================
// INITIALIZE MAP
// ========================================================
const map = L.map('map', {
    zoomControl: true
});
// ========================================================
// ESRI WORLD TOPOGRAPHIC BASEMAP
// ========================================================
L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',
    {
        attribution: 'Tiles &copy; Esri',
        maxZoom: 19
    }
).addTo(map);
// ========================================================
// LAYER VARIABLES
// ========================================================
let layer2016 = null;
let layer2025 = null;
let singleLayer = null;
let isDragging = false;
// ========================================================
// HTML ELEMENTS
// ========================================================
const mapContainer = map.getContainer();
const compareControl =
    document.getElementById('compareControl');
const handle =
    document.getElementById('compareHandle');
const label2016 =
    document.getElementById('label2016');
const label2025 =
    document.getElementById('label2025');
// ========================================================
// CREATE IMAGE OVERLAY
// ========================================================
function makeLayer(index, year) {
    const item = maps[index + '_' + year];
    if (!item) {
        throw new Error(
            'Map data not found: ' + index + ' ' + year
        );
    }
    const b = item.bounds;
    return L.imageOverlay(
        item.image,
        [
            [b.south, b.west],
            [b.north, b.east]
        ],
        {
            opacity: 1,
            interactive: false
        }
    );
}
// ========================================================
// APPLY SWIPE POSITION
// ========================================================
function applySwipe(position) {
    position = Math.max(
        0,
        Math.min(100, position)
    );
    compareControl.style.left = position + '%';
    const element2016 =
        layer2016 ? layer2016.getElement() : null;
    const element2025 =
        layer2025 ? layer2025.getElement() : null;
    if (element2016) {
        element2016.style.clipPath =
            `inset(0 ${100 - position}% 0 0)`;
    }
    if (element2025) {
        element2025.style.clipPath =
            `inset(0 0 0 ${position}%)`;
    }
}
// ========================================================
// MOVE DIVIDER USING MOUSE POSITION
// ========================================================
function moveDivider(clientX) {
    const rect =
        mapContainer.getBoundingClientRect();
    const x = clientX - rect.left;
    const percentage =
        (x / rect.width) * 100;
    applySwipe(percentage);
}
// ========================================================
// START DRAGGING
// ========================================================
handle.addEventListener(
    'pointerdown',
    function(event) {
        event.preventDefault();
        event.stopPropagation();
        isDragging = true;
        handle.setPointerCapture(event.pointerId);
        map.dragging.disable();
        moveDivider(event.clientX);
    }
);
// ========================================================
// DRAGGING MOVEMENT
// ========================================================
handle.addEventListener(
    'pointermove',
    function(event) {
        if (!isDragging) return;
        event.preventDefault();
        moveDivider(event.clientX);
    }
);
// ========================================================
// STOP DRAGGING
// ========================================================
function stopDragging() {
    if (!isDragging) return;
    isDragging = false;
    map.dragging.enable();
}
handle.addEventListener(
    'pointerup',
    stopDragging
);
handle.addEventListener(
    'pointercancel',
    stopDragging
);
handle.addEventListener(
    'lostpointercapture',
    stopDragging
);
// ========================================================
// CLEAR PREVIOUS LAYERS
// ========================================================
function clearLayers() {
    [
        layer2016,
        layer2025,
        singleLayer
    ].forEach(layer => {
        if (layer && map.hasLayer(layer)) {
            map.removeLayer(layer);
        }
    });
    layer2016 = null;
    layer2025 = null;
    singleLayer = null;
    compareControl.style.display = 'none';
    label2016.style.display = 'none';
    label2025.style.display = 'none';
}
// ========================================================
// FIT MAP TO BOTH YEARS
// ========================================================
function fitMap(index) {
    const b1 = maps[index + '_2016'].bounds;
    const b2 = maps[index + '_2025'].bounds;
    const south = Math.min(
        b1.south,
        b2.south
    );
    const north = Math.max(
        b1.north,
        b2.north
    );
    const west = Math.min(
        b1.west,
        b2.west
    );
    const east = Math.max(
        b1.east,
        b2.east
    );
    map.fitBounds([
        [south, west],
        [north, east]
    ]);
}
// ========================================================
// UPDATE MAP
// ========================================================
function updateMap() {
    const index =
        document.getElementById('index').value;
    const mode =
        document.getElementById('mode').value;
    clearLayers();
    try {
        if (mode === 'swipe') {
            layer2016 = makeLayer(index, '2016');
            layer2025 = makeLayer(index, '2025');
            layer2016.addTo(map);
            layer2025.addTo(map);
            compareControl.style.display = 'block';
            label2016.style.display = 'block';
            label2025.style.display = 'block';
            applySwipe(50);
            document.getElementById('status').textContent =
                index + ' | 2016 يسار — 2025 يمين';
        }
        else {
            singleLayer = makeLayer(
                index,
                mode === 'single2016'
                    ? '2016'
                    : '2025'
            );
            singleLayer.addTo(map);
            document.getElementById('status').textContent =
                index + ' | ' +
                (mode === 'single2016' ? '2016' : '2025');
        }
        fitMap(index);
        // Reapply clipping after map layout is updated.
        requestAnimationFrame(() => {
            if (mode === 'swipe') {
                applySwipe(50);
            }
        });
    }
    catch (error) {
        document.getElementById('status').textContent =
            'خطأ: ' + error.message;
        console.error(error);
    }
}
// ========================================================
// EVENT LISTENERS
// ========================================================
document.getElementById('index')
    .addEventListener('change', updateMap);
document.getElementById('mode')
    .addEventListener('change', updateMap);
// ========================================================
// INITIAL LOAD
// ========================================================
updateMap();
</script>
</body>
</html>
